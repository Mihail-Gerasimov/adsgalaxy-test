<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Adsgalaxy">
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171B"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="ag-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D4FF3F" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#D4FF3F" stop-opacity=".10"/>
      <stop offset="1" stop-color="#D4FF3F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ag-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4FF3F" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#D4FF3F" stop-opacity=".30"/>
      <stop offset="1" stop-color="#D4FF3F" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="ag-core" cx=".38" cy=".32" r=".78">
      <stop offset="0" stop-color="#EEFF9B"/>
      <stop offset=".55" stop-color="#D4FF3F"/>
      <stop offset="1" stop-color="#B4E116"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ag-bg)"/>
  <circle cx="32" cy="32" r="30" fill="url(#ag-glow)"/>

  <g transform="rotate(-27 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="11" fill="none" stroke="url(#ag-ring)" stroke-width="3.6"/>
    <circle cx="32" cy="32" r="14.2" fill="url(#ag-bg)"/>
  </g>

  <circle cx="32" cy="32" r="11" fill="url(#ag-core)"/>

  <g transform="rotate(-27 32 32)">
    <path d="M7 32A25 11 0 0 0 57 32" fill="none" stroke="#D4FF3F" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="55.4" cy="27.6" r="3.4" fill="#D4FF3F"/>
  </g>
